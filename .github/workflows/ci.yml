name: CI

on:
  push:
    branches: [main, QA]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Lock ya sincronizado (vitest 2.1.9 + vite 5 + esbuild 0.21.5). npm ci = install reproducible.
      - name: Install dependencies
        run: npm ci

      # Fitness function con dientes: boundary UI→api + límites de tamaño/complejidad
      # (lee .ai/policies/architecture-policies.yaml). --max-warnings 0 → exit 1 en cualquier violación.
      # ESTE es el único gate duro de la gobernanza hasta que los tests sean estables.
      # Estado de tests: deuda declarada en PROJECT-MAP.md → sección "Deuda técnica".
      - name: Lint (architecture gate)
        run: npm run lint

